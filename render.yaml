services:
  - type: web
    name: projectflow-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_PATH
        value: /opt/render/project/src/database.sqlite
      - key: FRONTEND_URL
        value: https://projectflow-omega.vercel.app
